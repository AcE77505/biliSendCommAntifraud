name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'biliSendCommAntifraud/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'biliSendCommAntifraud/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biliSendCommAntifraud
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: biliSendCommAntifraud/**/*.gradle*

      - name: Install Android SDK packages
        run: |
          SDKM="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKM" ]; then
            echo "sdkmanager 未找到，交给 AGP 自动下载 SDK 组件"
            exit 0
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-37" "build-tools;36.0.0" "platform-tools" || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug + release
        run: ./gradlew --stacktrace --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -type f -exec cp -f {} dist/ \;
          VER="$(grep -m1 -oE 'versionName[[:space:]]+"[^"]+"' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')"
          VER="${VER:-unknown}"
          cd dist
          for f in *.apk; do
            case "$f" in
              *debug*) variant=debug ;;
              *)       variant=release ;;
            esac
            mv -f "$f" "biliSendCommAntifraud-${VER}-${variant}.apk"
          done
          ls -l
          sha256sum *.apk | tee ../apk-sha256.txt
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### 构建产物 (versionName: ${{ steps.collect.outputs.version }})"
            echo
            echo "| 文件 | 字节 | SHA-256 |"
            echo "| --- | --- | --- |"
            if [ -f apk-sha256.txt ]; then
              while read -r sum name; do
                size="$(stat -c %s "dist/${name}" 2>/dev/null || echo '?')"
                echo "| ${name} | ${size} | ${sum} |"
              done < apk-sha256.txt
            fi
            echo
            echo "> release 包未签名（项目未配置 signingConfig，AGP 输出 \`app-release-unsigned.apk\`）；"
            echo "> 需要直接安装请使用 debug 包，或自行用 apksigner 签名。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: biliSendCommAntifraud-APK-${{ github.run_number }}
          path: |
            biliSendCommAntifraud/dist/*.apk
            biliSendCommAntifraud/apk-sha256.txt
          if-no-files-found: error
